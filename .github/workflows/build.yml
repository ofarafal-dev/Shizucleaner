name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Brak sekretu KEYSTORE_BASE64 (Settings > Secrets and variables > Actions). Bez stałego klucza aktualizacje w aplikacji nie zadziałają."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon testDebugUnitTest assembleRelease -PappVersionCode=${{ github.run_number }} 2>&1 | tee build.log; then
            # Dziennik z Actions bywa niedostępny z zewnątrz, więc błędy kompilacji i testów wypisujemy jako adnotację.
            msg=$(grep -E "^e: |error:|FAILED|What went wrong|Could not resolve|Execution failed|AssertionError|Exception" -A12 build.log | head -c 5000 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Błąd budowania::$msg"
            exit 1
          fi

      - name: Test summary
        id: tests
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import glob, sys
          import xml.etree.ElementTree as ET
          t = f = e = s = 0
          for p in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              r = ET.parse(p).getroot()
              t += int(r.get('tests', 0)); f += int(r.get('failures', 0))
              e += int(r.get('errors', 0)); s += int(r.get('skipped', 0))
          if t == 0:
              sys.exit("Nie znaleziono wyników testów — testy się nie uruchomiły")
          print(f"summary=Testy jednostkowe: {t}, błędy: {f + e}, pominięte: {s}.")
          PY

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Enklawa.apk
          gh release create "v${{ github.run_number }}" Enklawa.apk \
            --title "0.1.${{ github.run_number }}" \
            --notes "Build ${{ github.run_number }}, commit ${GITHUB_SHA::7}. ${{ steps.tests.outputs.summary }}" \
            --latest

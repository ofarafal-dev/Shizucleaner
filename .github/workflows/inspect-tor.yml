name: Inspect tor-android
on:
  push:
    branches: [inspect-tor]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Inspect
        run: |
          set -x
          mkdir w && cd w
          for v in 0.4.9.14 0.4.8.17 0.4.7.14; do curl -fsSL -o tor.aar "https://repo1.maven.org/maven2/info/guardianproject/tor-android/$v/tor-android-$v.aar" && echo $v > ../version.txt && break; done
          curl -fsSL https://repo1.maven.org/maven2/info/guardianproject/tor-android/maven-metadata.xml -o ../meta.xml || true
          curl -fsSL https://repo1.maven.org/maven2/info/guardianproject/jtorctl/maven-metadata.xml -o ../jtorctl-meta.xml || true
          unzip -q tor.aar -d aar
          { echo "version: $(cat ../version.txt)"; echo; echo "== files"; (cd aar && find . -type f | sort | xargs ls -l); echo; echo "== manifest"; cat aar/AndroidManifest.xml; echo; echo "== javap"; mkdir cls && (cd cls && unzip -q ../aar/classes.jar); find cls -name '*.class' | sed 's|cls/||;s|\.class$||;s|/|.|g' | grep -v '\$[0-9]' | xargs javap -public -constants -cp cls; } > ../tor-api.txt 2>&1
          cd ..
          git config user.name github-actions; git config user.email actions@github.com
          git checkout -q -b inspect-out
          git add -f tor-api.txt meta.xml jtorctl-meta.xml
          git commit -q -m "tor api"
          git push -q origin inspect-out

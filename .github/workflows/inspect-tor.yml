name: Inspect tor-android
on:
  push:
    branches: [inspect-tor]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Inspect
        run: |
          mkdir -p out
          for v in 0.4.7.14 0.4.8.17 0.4.8.22 0.4.9.5 0.4.9.8; do
            d=w$v; mkdir -p $d && cd $d
            curl -fsSL -o tor.aar "https://repo1.maven.org/maven2/info/guardianproject/tor-android/$v/tor-android-$v.aar" || { echo "no aar $v" > ../out/$v.txt; cd ..; continue; }
            curl -fsSL -o tor.pom "https://repo1.maven.org/maven2/info/guardianproject/tor-android/$v/tor-android-$v.pom" || true
            unzip -q tor.aar -d aar
            { echo "== $v"; cat aar/META-INF/com/android/build/gradle/aar-metadata.properties; echo; grep -E "artifactId|<version>|scope" tor.pom; echo; mkdir cls && (cd cls && unzip -q ../aar/classes.jar); find cls -name '*.class' | sed 's|cls/||;s|\.class$||;s|/|.|g' | grep -v '\$[0-9]' | grep TorService | xargs javap -public -constants -cp cls | grep -E "ACTION|EXTRA|STATUS|getSocksPort|LocalBinder|getService"; } > ../out/$v.txt 2>&1
            cd ..
          done
          cat out/*.txt > tor-compat.txt
          git config user.name github-actions; git config user.email actions@github.com
          git checkout -q -b inspect-out2
          git add -f tor-compat.txt
          git commit -q -m "compat"
          git push -q origin inspect-out2
